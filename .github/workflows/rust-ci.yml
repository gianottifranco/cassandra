name: Rust CI

on:
  push:
    branches: [trunk]
    paths:
      - 'rust/**'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    branches: [trunk]
    paths:
      - 'rust/**'
      - '.github/workflows/rust-ci.yml'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: rust

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/Cargo.toml

  bench:
    name: Benchmarks (compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Compile benchmarks
        run: cargo bench --workspace --no-run

  gap-audit:
    name: Gap Audit
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Scan TODOs/stubs
        run: python3 scripts/gap_audit.py todos --strict
      - name: Scan gap guards
        run: python3 scripts/gap_audit.py gap-guards --strict

  coverage-guard:
    name: Coverage Guard
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate gap matrix (strict)
        run: python3 scripts/coverage_audit.py --check-matrix --strict --repo-root .
      - name: Validate YAML
        run: python3 -c "import yaml; yaml.safe_load(open('docs/rewrite/final_gap_matrix.yaml')); print('YAML valid')"
      - name: Count gap guards
        working-directory: rust
        run: |
          echo "Ignored gap guards:"
          grep -c '#\[ignore' crates/cassandra-diff-tests/src/gap_guards.rs || echo "0"
          echo "Total gap guard functions:"
          grep -c 'fn gap_guard_' crates/cassandra-diff-tests/src/gap_guards.rs || echo "0"

  golden-tests:
    name: Golden Tests (offline)
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Run golden tests
        run: cargo test -p cassandra-diff-tests -- --nocapture

  differential:
    name: Differential Tests (vs Java)
    runs-on: ubuntu-latest
    needs: [check]
    # Run on trunk push only (too slow for every PR)
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install -r diff-tests/pytest/requirements.txt
      - name: Start Docker services
        working-directory: rust/diff-tests
        run: docker compose up -d java-oracle rust-sut
      - name: Wait for Java oracle
        run: |
          echo "Waiting for Java oracle to be ready..."
          for i in $(seq 1 120); do
            if docker exec cassandra-java-oracle cqlsh -e "SELECT now() FROM system.local" 2>/dev/null; then
              echo "Oracle is ready!"
              break
            fi
            if [ $i -eq 120 ]; then
              echo "Oracle did not become ready within timeout"
              exit 1
            fi
            sleep 2
          done
      - name: Generate golden fixtures
        run: |
          cd diff-tests/golden-gen
          python3 generate_golden.py --host localhost --port 19042 --output ../golden
      - name: Run Rust golden tests (with fresh fixtures)
        run: cargo test -p cassandra-diff-tests -- --nocapture
      - name: Run pytest diff-tests
        run: |
          cd diff-tests/pytest
          python3 -m pytest -v --tb=short || true
        # pytest failures are non-blocking (Rust XFAIL expected)
      - name: Teardown
        if: always()
        working-directory: rust/diff-tests
        run: docker compose down -v
