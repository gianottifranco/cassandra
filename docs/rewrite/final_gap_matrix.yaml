      ClusterMetadataFcts transformation_kind Java Transformation.Kind id/name
      mapping,
      CollectionFcts map_keys/map_values for native and complex map key/value
      pairs with return types derived from the concrete map signature,
      collection_count for list/set/map, collection_min/max for native and
      complex list/set elements using CQL type comparison, and
      collection_sum/avg for fixed numeric, varint, and decimal list/set
      elements,
      AggregateFcts count(*) and count(column) null semantics execute, and
      sum/avg preserve Java argument result types across fixed numeric, counter,
      varint, and decimal execution,
      FormatFcts format_time/format_bytes Java unit conversion and formatting
      rules for supported scalar inputs,
      LengthFcts length and octet_length semantics, BytesConversionFcts
      Java/legacy blob aliases for native non-blob types, JSON to_json/tojson
      argument-typed selector/write execution plus from_json/fromjson
      receiver-typed execution for scalar and collection write terms,
      VectorFcts similarity_cosine/similarity_euclidean/similarity_dot_product
      with Java all-zero cosine rejection, masking, aggregate functions,
      selector evaluation, CREATE/DROP
      FUNCTION/AGGREGATE parsing/planning, and UDF/UDA metadata are implemented.
      Missing: full Java built-in catalog, production UDF sandbox/WASM
