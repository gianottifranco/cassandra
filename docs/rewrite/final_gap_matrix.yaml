    status: partial
    evidence_type: [unit]
    criticality: P0
    config_condition: null
    closure_phase: prompt-03
    notes: >
      Keyspace, table, column metadata with immutable catalog and persistence.
      UDT/UDF/UDA metadata, index metadata, schema agreement, and system
      keyspace metadata are implemented. Local schema migrations are
      coordinated through DistributedSchema with atomic catalog updates,
      version recomputation, and change notifications. Remote migration
      envelopes are serializable and enforce base-version matching before
      application, and SchemaPush transport accepts typed migration payloads
      while preserving legacy snapshot pushes. SchemaPush migration fan-out
      with per-peer ACK/failure reporting, retry attempts, and backoff is
      implemented. Remote reconciliation now distinguishes apply,
      already-applied, and pull-required outcomes for divergent versions.
      Conservative snapshot merge combines independent divergent schema
      objects and reports explicit conflicts. Schema migration decisions are
      persisted in an append-only JSONL journal for recovery. Cluster
      coordination applies locally, journals, then fans out with retry/ACK
      reporting. FIFO migration scheduling is implemented. Missing:
      production runtime/background scheduler integration, full semantic
      conflict resolution, and full Java schema-manager parity.

