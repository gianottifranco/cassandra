    criticality: P1
    config_condition: null
    closure_phase: prompt-12
    notes: >
      FunctionRegistry, overload resolution, time/UUID, token/cast/blob,
      MathFcts fixed-width numeric abs/exp/log/log10/round plus varint
      abs/exp/log/log10/round and decimal abs/exp/log/log10/round,
      TimeFcts current/timeuuid/date/timestamp conversion names covering Java
