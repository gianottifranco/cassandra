    status: partial
    evidence_type: [unit]
    criticality: P1
    config_condition: null
    closure_phase: prompt-07
    notes: >
      IF EXISTS/IF NOT EXISTS, scalar column comparisons, IN conditions,
      collection element conditions, and CONTAINS/CONTAINS KEY conditions are
      parsed and evaluated with typed collection decoding.

  - id: cql-constraints
    name: CQL Constraints
