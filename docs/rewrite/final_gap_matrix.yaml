  - id: cql-functions-masking
    name: CQL Masking Functions
    subsystem: cql
    java_packages:
      - org.apache.cassandra.cql3.functions.masking
    rust_crate: cassandra-cql
    status: partial
    evidence_type: [unit, integration]
    criticality: P2
    config_condition: null
    closure_phase: prompt-12
    notes: >
      mask_default, mask_null, and mask_replace resolve native scalar overloads
      with Java-style return typing and serialized default/null/replacement
      behavior. mask_default also resolves complex list/set/map empty defaults
      plus tuple/UDT/vector nested field defaults. mask_inner and mask_outer use
      the Java signatures with begin/end integer arguments and optional
      single-character padding for ascii/text inputs, including unclamped
      begin/end boundary behavior. mask_hash returns blob
      digests with SHA-256 as the default algorithm and supports the
      JDK-standard MD2, MD5, SHA-1, SHA-2, and SHA3 MessageDigest names. Local
      SELECT column masking now applies masks through FunctionRegistry using
      the column CQL type and schema-stored partial arguments, and SELECT JSON
      renders masked values according to the result column CQL type instead of
      raw bytes. GROUP BY uses clear column values for grouping and masks only
      the projected results, ORDER BY/LIMIT over clustering rows is applied to
      clear values before masked projection, and paged local SELECT applies
      masks on every returned page. ALTER MASK validates mask function names,
      arity, argument types, return compatibility, and function-level argument
      semantics before storing schema metadata. CREATE TABLE and ALTER TABLE ADD
      column masks use the same validation, and column masks reject
      type-altering functions unless the returned type matches the masked column
      type. Local SELECT honors UNMASK for clear-value reads and enforces
      SELECT_MASKED when a user filters on masked columns, including token
      restrictions over masked partition keys. Missing: provider-specific
      MessageDigest extensions, remaining protocol/permission edge cases, and
      complete dynamic masking enforcement across every read path.

