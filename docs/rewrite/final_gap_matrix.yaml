  # ═══════════════════════════════════════════════════════════════
  # NATIVE PROTOCOL
  # ═══════════════════════════════════════════════════════════════

  - id: native-protocol
    name: CQL Native Protocol v4/v5
    subsystem: transport
    java_packages:
      - org.apache.cassandra.transport
    rust_crate: cassandra-native-protocol
    status: partial
    evidence_type: [unit]
    criticality: P0
    config_condition: null
    closure_phase: prompt-02
    notes: >
      Frame codec, v4/v5 lifecycle, startup/options/auth/register handling,
      protocol negotiation errors, query/prepare/execute/batch pass-through,
      tracing/warnings/custom payload flags, compression, and type/result
      encoders are implemented; server crate wires a TCP listener and query
      processor. REGISTER subscriptions are now connected to a server-wide
      event dispatcher, schema changes are published as protocol EVENT frames
      on stream -1, connections filter pushes by registered event type, and
      native-server startup/shutdown emit STATUS_CHANGE UP/DOWN events. The
      server now enforces configured native_transport_max_frame_size from frame
      headers before reading oversized payload bodies and returns PROTOCOL_ERROR
      on violations. REGISTER validates requested event types atomically and
      rejects unsupported types with PROTOCOL_ERROR. Request lifecycle rejects
      response-direction frames and response-only opcodes sent by clients with
      PROTOCOL_ERROR. TCM topology notifications now register a native-protocol
      listener that republishes committed node register, unregister, token
      movement, and liveness state changes as TOPOLOGY_CHANGE/STATUS_CHANGE
      push events. Event push payloads are retained logically and encoded per
      connection with the client's negotiated protocol version, including v5
      beta clients. Native TCP connections now apply negotiated LZ4/Snappy
      frame compression on incoming requests plus responses and events, and
      reject compressed frames before STARTUP negotiation with PROTOCOL_ERROR.
      STARTUP validates the required CQL_VERSION option against the advertised
      supported version and returns PROTOCOL_ERROR without closing the
      connection for missing or unsupported values. Request lifecycle now
      rejects response-only WARNING flags, unknown request flags, and USE_BETA
      outside v5-beta with PROTOCOL_ERROR while keeping the connection usable.
      Request decoding now rejects trailing body bytes and maps malformed
      lifecycle/query request bodies to PROTOCOL_ERROR responses instead of
      surfacing internal connection errors. The TCP server prevalidates frame
      headers with unknown opcode bytes and returns PROTOCOL_ERROR using the
      decoded stream id before the frame codec would abort the connection.
      Compatibility coverage now includes a v5-beta driver-style TCP sequence
      for OPTIONS, STARTUP, schema setup, PREPARE, and EXECUTE with
      result_metadata_id/NO_METADATA behavior. PREPARE, QUERY, EXECUTE, and
      BATCH option decoding now matches Java v5 flag width/keyspace semantics:
      request options read 32-bit flags, PREPARE preserves request keyspace,
      QUERY/EXECUTE/BATCH honor KEYSPACE/NOW_IN_SECONDS bits instead of
      consuming unflagged trailing bytes, and BATCH keyspace/now_in_seconds
      options are preserved. Server-side query/batch processing now honors
      request keyspace overrides, and driver-style v5 prepare/execute coverage
      writes the correct 32-bit option flags and verifies request-keyspaced
      PREPARE against an unqualified statement. TCP coverage now also verifies
      request-keyspaced v5 BATCH with an unqualified mutation and read-back.
      Request decoding retains custom payloads for QUERY, PREPARE, EXECUTE,
      and BATCH requests. BATCH request decoding now rejects query kind bytes
      other than 0 or 1, matching Java's ProtocolException path. Missing:
      remaining protocol edge cases and broader Java driver compatibility
      coverage.

