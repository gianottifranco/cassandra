    rust_crate: cassandra-types
    status: partial
    evidence_type: [unit, integration]
    criticality: P0
    config_condition: null
    closure_phase: prompt-02
    notes: >
      Native scalar types, collections, frozen nested collections, UDTs,
      vectors, tuples, legacy CompositeType, and DynamicCompositeType parsing,
      serialization, and comparison are implemented.

  - id: cql-parser
    name: CQL Parser
    subsystem: cql
    java_packages:
      - org.apache.cassandra.cql3
    rust_crate: cassandra-cql
    status: partial
    evidence_type: [unit, golden]
    criticality: P0
    config_condition: null
    closure_phase: prompt-03
    notes: >
      Recursive-descent parser. SELECT, INSERT, UPDATE, DELETE, CREATE/ALTER/DROP
      KEYSPACE/TABLE/TYPE/INDEX/FUNCTION/AGGREGATE/TRIGGER, DROP variants,
      ALTER TYPE, USE, GRANT, REVOKE, roles, DESCRIBE, and masking clauses
      are covered. COMMENT ON KEYSPACE/TABLE/COLUMN/TYPE/FIELD statements now
      parse to AST and plan/execute against schema metadata.
      BATCH grammar limits objectives to INSERT, UPDATE, and DELETE statements
      like Java.
      DELETE USING follows Java's delete-only grammar by accepting TIMESTAMP and
      rejecting TTL.
      TRUNCATE accepts Java's optional COLUMNFAMILY keyword and rejects TABLE.
      SELECT JSON and INSERT JSON string syntax are parsed, and INSERT JSON
      execution accepts nested JSON arrays/objects via serde_json plus DEFAULT
      NULL/UNSET handling. Missing: remaining CQL grammar edge cases.

