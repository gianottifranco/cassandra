# Cassandra Rust Rewrite — Final Gap Matrix
#
# Exhaustive classification of every Java subsystem against Rust coverage.
# Auto-validated by: cargo xtask coverage-audit / python3 scripts/coverage_audit.py --check-matrix
#
# Status values:
#   done             — Rust at parity, evidence exists
#   partial          — Core logic, known gaps documented
#   missing          — Not yet started
#   blocked          — Depends on incomplete subsystem
#   stub             — API surface only, minimal logic
#   trunk-only       — Present only in trunk, gated behind feature flag
#   experimental     — Flagged experimental upstream
#   tooling-only     — Operational tool, not data-path
#   ops-only         — Operational concern (metrics, JMX)
#   baseline-excluded — Excluded with justification

baseline:
  primary:
    branch: trunk
