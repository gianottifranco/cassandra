cassandra-config = { path = "../cassandra-config" }
cassandra-native-protocol = { path = "../cassandra-native-protocol" }
cassandra-storage = { path = "../cassandra-storage" }
cassandra-cluster-metadata = { path = "../cassandra-cluster-metadata" }
