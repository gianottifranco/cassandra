cassandra-security = { path = "../cassandra-security" }
cassandra-admin = { path = "../cassandra-admin" }
cassandra-cql = { path = "../cassandra-cql" }
cassandra-schema = { path = "../cassandra-schema" }
cassandra-types = { path = "../cassandra-types" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
