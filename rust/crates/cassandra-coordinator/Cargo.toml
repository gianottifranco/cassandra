[package]
name = "cassandra-coordinator"
description = "Read/write coordinators, consistency level enforcement, paging, aggregation, Paxos/LWT"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
cassandra-common = { path = "../cassandra-common" }
tokio = { workspace = true }
tracing = { workspace = true }
cassandra-types = { path = "../cassandra-types" }
cassandra-schema = { path = "../cassandra-schema" }
cassandra-storage = { path = "../cassandra-storage", features = ["materialized-views", "triggers", "udfs", "ucs"] }
cassandra-messaging = { path = "../cassandra-messaging" }
cassandra-cluster-metadata = { path = "../cassandra-cluster-metadata" }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
futures-util = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
cassandra-accord = { version = "0.1.0", path = "../cassandra-accord" }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "read_path"
harness = false
