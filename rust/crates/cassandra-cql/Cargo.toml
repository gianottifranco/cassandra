[package]
name = "cassandra-cql"
description = "CQL parser, statement types, query validation, and prepared statement caching"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
cassandra-common = { path = "../cassandra-common" }
cassandra-native-protocol = { path = "../cassandra-native-protocol" }
cassandra-types = { path = "../cassandra-types" }
cassandra-schema = { path = "../cassandra-schema" }
tracing = { workspace = true }
md-5 = { workspace = true }
dashmap = { workspace = true }
hex = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }

[features]
default = []
# Enable WASM-based UDF execution via wasmtime.
# When disabled (default), WasmUdfExecutor::new() returns an error.
udf-wasm = []

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
