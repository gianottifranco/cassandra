[package]
name = "cassandra-admin"
description = "Observability (metrics, tracing), diagnostics, nodetool-compatible administration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
cassandra-common = { path = "../cassandra-common" }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
prometheus = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
cassandra-repair = { version = "0.1.0", path = "../cassandra-repair" }
cassandra-cluster-metadata = { version = "0.1.0", path = "../cassandra-cluster-metadata" }
cassandra-storage = { version = "0.1.0", path = "../cassandra-storage" }
cassandra-schema = { version = "0.1.0", path = "../cassandra-schema" }
cassandra-coordinator = { version = "0.1.0", path = "../cassandra-coordinator" }

[features]
sasi = ["cassandra-storage/sasi"]

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "admin_bench"
harness = false
