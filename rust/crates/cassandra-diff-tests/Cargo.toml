[package]
name = "cassandra-diff-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

description = """
Differential testing framework for the Cassandra Java-to-Rust rewrite.
Provides comparators, golden test runners, and fuzz strategies for
verifying Rust output against the Java oracle.
"""

[dependencies]
cassandra-common = { path = "../cassandra-common" }
cassandra-native-protocol = { path = "../cassandra-native-protocol" }
cassandra-storage = { path = "../cassandra-storage" }
cassandra-types = { path = "../cassandra-types" }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
hex = "0.4"
proptest = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "p0_gap_benchmarks"
harness = false
