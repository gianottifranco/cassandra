[package]
name = "cassandra-accord"
version = "0.1.0"
edition = "2021"
description = "Accord consensus and transaction routing"

[dependencies]

serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
dashmap = "6"
