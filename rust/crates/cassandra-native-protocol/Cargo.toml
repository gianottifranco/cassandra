[package]
name = "cassandra-native-protocol"
description = "CQL binary protocol v4/v5 frame codec, message types, and connection lifecycle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["compression-lz4", "compression-snappy"]
compression-lz4 = ["lz4_flex"]
compression-snappy = ["snap"]

[dependencies]
cassandra-common = { path = "../cassandra-common" }
cassandra-security = { path = "../cassandra-security" }
cassandra-types = { path = "../cassandra-types" }
bytes = { workspace = true }
byteorder = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
md-5 = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }

# Optional compression backends
lz4_flex = { workspace = true, optional = true }
snap = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
criterion = { workspace = true }
bytes = { workspace = true }
tokio-util = { workspace = true }

[[bench]]
name = "protocol_bench"
harness = false
