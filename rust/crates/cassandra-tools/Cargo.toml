[package]
name = "cassandra-tools"
description = "CLI tools: nodetool replacement, sstable utilities, standalone compaction"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "fqltool"
path = "src/fqltool.rs"

[dependencies]
cassandra-common = { path = "../cassandra-common" }
cassandra-config = { path = "../cassandra-config" }
cassandra-admin = { path = "../cassandra-admin" }
cassandra-storage = { path = "../cassandra-storage" }
cassandra-security = { path = "../cassandra-security" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
reqwest = { version = "0.13.2", features = ["json", "blocking"] }
