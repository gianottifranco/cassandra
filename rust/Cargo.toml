[workspace]
resolver = "2"
members = [
    "crates/cassandra-common",
    "crates/cassandra-config",
    "crates/cassandra-types",
    "crates/cassandra-schema",
    "crates/cassandra-native-protocol",
    "crates/cassandra-cql",
    "crates/cassandra-storage",
    "crates/cassandra-cluster-metadata",
    "crates/cassandra-messaging",
    "crates/cassandra-coordinator",
    "crates/cassandra-repair",
    "crates/cassandra-streaming",
    "crates/cassandra-security",
    "crates/cassandra-admin",
    "crates/cassandra-server",
    "crates/cassandra-tools",
    "crates/cassandra-diff-tests",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/apache/cassandra"
rust-version = "1.85"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

# Byte manipulation
bytes = "1"
tokio-util = { version = "0.7", features = ["codec"] }
byteorder = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Concurrency
crossbeam = "0.8"
parking_lot = "0.12"
dashmap = "6"

# Configuration
figment = { version = "0.10", features = ["yaml", "env"] }

# Compression
lz4_flex = "0.11"
snap = "1"

# Hashing
md-5 = "0.10"

# UUID
uuid = { version = "1", features = ["v4", "v1"] }

# Testing
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
