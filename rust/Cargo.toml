[workspace]
resolver = "2"
members = [
    "crates/cassandra-common",
    "crates/cassandra-config",
    "crates/cassandra-types",
    "crates/cassandra-schema",
    "crates/cassandra-native-protocol",
    "crates/cassandra-cql",
    "crates/cassandra-storage",
    "crates/cassandra-cluster-metadata",
    "crates/cassandra-messaging",
    "crates/cassandra-coordinator",
    "crates/cassandra-repair",
    "crates/cassandra-streaming",
    "crates/cassandra-security",
    "crates/cassandra-admin",
    "crates/cassandra-server",
    "crates/cassandra-tools",
    "crates/cassandra-diff-tests",
    "xtask", "crates/cassandra-accord",
    "crates/cassandra-migration",
    "crates/cassandra-io",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/apache/cassandra"
rust-version = "1.85"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

# Byte manipulation
bytes = "1"
tokio-util = { version = "0.7", features = ["codec"] }
byteorder = "1"
futures-util = { version = "0.3", features = ["sink"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Concurrency
crossbeam = "0.8"
parking_lot = "0.12"
dashmap = "6"

# Configuration
figment = { version = "0.10", features = ["yaml", "env"] }

# Caching
lru = "0.12"

# Compression
lz4_flex = "0.11"
snap = "1"
zstd = "0.13"
flate2 = "1"
memmap2 = "0.9"
crc32fast = "1"

# Hashing
md-5 = "0.10"
sha2 = "0.10"

# Random
rand = "0.8"

# UUID
uuid = { version = "1", features = ["v4", "v1", "serde"] }

# Testing
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

# TLS
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
rcgen = "0.13"

# Auth
bcrypt = "0.16"

# Metrics
prometheus = "0.13"

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP admin
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
http-body-util = "0.1"

# Network
ipnet = "2"

# File watching
notify = "7"
hex = "0.4"
fs2 = "0.4"
regex = "1"

# Crypto (encryption-at-rest)
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
cipher = { version = "0.4", features = ["block-padding"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true

[profile.production]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# PGO-ready profile: build with this, run workload, then rebuild.
# `RUSTFLAGS="-Cprofile-generate=/tmp/pgo" cargo build --profile release-pgo`
# `RUSTFLAGS="-Cprofile-use=/tmp/pgo/merged.profdata" cargo build --profile release-pgo`
[profile.release-pgo]
inherits = "release"
lto = "fat"
codegen-units = 1
